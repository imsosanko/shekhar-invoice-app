# Netlify config for the HYBRID deployment option only: this hosts the
# static frontend (public/) on Netlify's CDN, while the actual server
# (Express API + Python PDF/Excel generation) runs elsewhere — Railway,
# using the Dockerfile in this repo — since Netlify itself
# cannot run that server at all (see README "Deploying online").
#
# The [[redirects]] rules below make Netlify transparently proxy every
# /api/* request to your real backend, so the frontend's existing
# relative fetch('/api/...') calls in public/js/api.js work completely
# unchanged — no code edits, no CORS configuration needed, because from
# the browser's point of view everything still comes from the same
# Netlify domain.
#
# sw.js is served DIRECTLY from Netlify's own /public folder — not proxied
# to the backend. Proxying it caused a 404 because Netlify's redirect
# system has trouble force-serving service worker files from remote URLs.
#
# Backend URL: https://shekhar-invoice-app.up.railway.app

[build]
  publish = "public"
  command = "echo 'No build step needed - static files only'"

# Proxy all API calls to the Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://shekhar-invoice-app.up.railway.app/api/:splat"
  status = 200
  force = true

# sw.js must be served from Netlify's own /public folder, NOT proxied.
# This explicit rule (matching to itself) ensures Netlify serves the
# static file at public/sw.js with the correct MIME type, which is what
# the browser requires to register a service worker.
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200
  force = true

# Everything else (index.html, css, js) is served directly from Netlify's
# own CDN as static files — fast, and exactly what Netlify is good at.
# The SPA fallback below makes any unknown route load index.html so
# client-side routing works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200